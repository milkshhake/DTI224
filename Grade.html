<!DOCTYPE html>
<html>
<head>
    <title>Calculate Grade</title>
</head>
<body>

<h1>Calculate Grade</h1>

<label>Enter Amount:</label>
<input type="number" id="mark">
<button onclick="calculateGrade()">Submit</button>

<p id="result"></p>

<script>
function calculateGrade() {
    let mark = parseInt(document.getElementById("mark").value);
    let grade = "";

    // Check for invalid input
    if (isNaN(mark) || mark < 0 || mark > 100) {
        document.getElementById("result").innerHTML =
            "Invalid input! Please enter a number between 0 and 100.";
        return;
    }

    if (mark >= 80) {
        grade = "A";
    }
    else if (mark >= 70) {
        grade = "B";
    }
    else if (mark >= 60) {
        grade = "C";
    }
    else if (mark >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    document.getElementById("result").innerHTML = "You got a " + grade;
}
</script>

</body>
</html>
