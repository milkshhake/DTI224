<!DOCTYPE html>
<html>
<head>
    <title>Calculate Change</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input {
            width: 200px;
            padding: 5px;
        }

        button {
            padding: 5px 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            line-height: 35px;
        }
    </style>
</head>
<body>

<h1>Calculate Change</h1>

<label>Enter Amount:</label>
<input type="number" id="amount">
<button onclick="calculateChange()">Submit</button>

<div id="result"></div>

<script>

function calculateChange() {

    let amount = parseInt(document.getElementById("amount").value);

    if (isNaN(amount) || amount < 0) {
        document.getElementById("result").innerHTML = "Please enter a valid amount.";
        return;
    }

    let money = [1000, 500, 100, 50, 20, 10, 5, 2, 1];

    let output = "";

    for (let i = 0; i < money.length; i++) {

        let count = Math.floor(amount / money[i]);

        if (count > 0) {
            output += count + " of ฿" + money[i] + "<br>";
        }

        amount = amount % money[i];
    }

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
